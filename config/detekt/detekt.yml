# Detekt configuration for Gymora.
# Builds upon the default rule set; only project-specific overrides live here.
# Constitution X: checks are never disabled to make a build pass.

build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 12
  TooManyFunctions:
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    ignoreDeprecated: true
    ignorePrivate: false
    ignoreOverridden: false

style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 4

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
